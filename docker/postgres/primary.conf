# =========================================================
# PostgreSQL 16 流复制主库配置（由 -c config_file= 显式加载）
#
# 重要：使用 config_file 后镜像自带 sample 配置不再生效，
#       未列出的参数一律回退到编译默认值（不是 sample 值），
#       因此必要参数必须在此显式写出。
#
# 本文件同时被备库（replica）挂载使用：
#   - 备库以 standby 模式运行时，wal_level / max_wal_senders 等
#     主库参数无害，hot_standby / restore_command 对备库生效；
#   - 备库被 promote 为新主后直接沿用本配置，archive_command
#     路径不变，WAL 归档不中断（提升即成为可写主库）。
#
# data_directory 不写死：postgres 无 -D 启动时读取 PGDATA
# 环境变量（官方镜像已设置为 /var/lib/postgresql/data）。
# =========================================================

# ---------- 网络 ----------
listen_addresses = '*'        # 监听所有网卡，容器间复制链路需要（编译默认仅 localhost）
port = 5432                   # 显式指定端口，config_file 模式下不再继承 sample 配置

# ---------- 流复制 ----------
wal_level = replica           # 流复制所需的最低 WAL 级别
max_wal_senders = 10          # WAL 发送进程上限（备库连接 + pg_basebackup 并发占用）
max_replication_slots = 4     # 复制槽数量上限（本方案预留，防止 WAL 被过早回收）
hot_standby = on              # 备库允许只读查询（默认即 on，显式写出以便审计）
wal_keep_size = 1024          # 主库为备库保留的 WAL 量（MB），备库短暂断连后可追赶
wal_log_hints = on            # 将 hint bit 写入 WAL，pg_rewind 依赖（旧主回切重建时可用）

# ---------- WAL 归档（PITR 基线） ----------
archive_mode = on             # 始终归档：主库归档；备库 promote 后继续归档不中断
archive_timeout = 60          # 最多 60 秒强制切换一次 WAL 段，作为流复制的归档兜底，RPO 接近 0
archive_command = 'test ! -f /walarchive/%f && cp %p /walarchive/%f'
                              # 归档到共享卷 /walarchive；test 防止覆盖已存在的同名段
                              # （promote 后时间线切换，段文件名随之变化，不会冲突）

# ---------- 恢复（备库 / PITR 使用，主库忽略） ----------
restore_command = 'cp /walarchive/%f %p'
                              # 备库流复制断档时从归档补 WAL；PITR 恢复时同样使用该命令
recovery_target_timeline = 'current'
                              # 备库必须锁定 basebackup 所在时间线：发生过一次 failover 后，
                              # 归档里会残留多个 .history 分支，默认值 'latest' 会把恢复
                              # 拉到分叉的旧时间线上直接 FATAL（曾实测踩坑）。
                              # PITR 临时实例不使用本文件（restore-pitr.sh 独立配置，
                              # 默认 'latest'，符合任意时间点恢复语义）。
