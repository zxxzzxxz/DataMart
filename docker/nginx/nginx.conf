# ==========================================================================
# DataMart 统一入口：TLS 终结 + 反向代理
#
# 设计要点：
# 1. 所有后端均为 docker 内网 HTTP 服务，本层统一终结 TLS，HTTP(80) 一律 301 到 HTTPS。
# 2. 所有反代 location 一律使用「set 变量 + proxy_pass 变量」模式，强制 nginx
#    通过 http 块的 resolver（docker 内嵌 DNS 127.0.0.11）在请求期解析主机名，
#    并按 valid=10s 的 TTL 过期重查。这样 airflow 副本扩缩/任意后端容器重启换 IP 后，
#    nginx 不会死握启动时解析到的旧 IP（proxy_pass 直接写主机名的经典坑）。
# 3. 变量模式的 proxy_pass 绝不能带 URI 部分（包括结尾的 "/"）：一旦带了 URI，
#    nginx 会原样使用该 URI 而不再透传原始请求路径。需要改路径时（/alerts/）
#    必须先 rewrite ... break 改写 $uri，再用无 URI 的变量 proxy_pass 透传。
# 4. proxy_set_header 不存在跨层级"叠加"继承：location 内一旦写了任意一条
#    proxy_set_header，外层（server/http）的同指令全部失效。因此每个 location
#    都显式写全 4 个标准头，不依赖继承，避免踩坑。
# ==========================================================================

worker_processes auto;

# 错误日志输出到 stderr，配合 access_log /dev/stdout，便于 docker logs / Loki 采集
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # docker 内嵌 DNS：变量 proxy_pass 的运行期解析依赖它。
    # valid=10s 覆盖 docker DNS 记录的 TTL，ipv6=off 避免解析出容器 IPv6 地址。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Airflow 变量上传/设计器保存大图等场景可能有大请求体
    client_max_body_size 50m;

    # 代理超时与缓冲（read 给足 300s，兼容 Airflow UI 的慢查询/长轮询）
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;
    proxy_buffering on;
    proxy_buffer_size  32k;   # Airflow/Grafana 的响应头可能较大
    proxy_buffers      8 16k;

    # WebSocket 升级头映射：仅当客户端确实发起 Upgrade 时才回送
    # "Connection: upgrade"，普通请求回 "close"，避免污染同 location 的普通 HTTP 请求
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ----------------------------------------------------------------------
    # 80：主站点唯一职责——全量 301 到 HTTPS
    # （8443 为独立入口，其 80->8443 跳转不属于本层职责，无需处理）
    # ----------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ----------------------------------------------------------------------
    # 443：主站点（Airflow 根路径 + 各监控组件子路径）
    # ----------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Frame-Options      SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff  always;

        # Airflow UI + API（后端 airflow-apiserver:8080，2 副本），挂在根路径。
        # 变量 proxy_pass + resolver：副本扩缩/重启后按 10s TTL 重新解析服务名，
        # 多副本地址由 docker DNS 返回并随之轮询生效。
        location / {
            set $upstream_airflow airflow-apiserver;
            proxy_pass http://$upstream_airflow:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Grafana（后端 grafana:3000），已配 ROOT_URL=https://localhost/grafana/
        # 与 serve_from_sub_path，原样透传，不做任何路径改写。
        location /grafana/ {
            set $upstream_grafana grafana;
            proxy_pass http://$upstream_grafana:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Prometheus（后端 prometheus:9090），启动参数已带
        # --web.external-url=https://localhost/prometheus/ --web.route-prefix=/，
        # 原样透传。
        location /prometheus/ {
            set $upstream_prometheus prometheus;
            proxy_pass http://$upstream_prometheus:9090;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Alertmanager（后端 alertmanager:9093），启动参数已带
        # --web.external-url=https://localhost/alertmanager/ --web.route-prefix=/，
        # 原样透传。
        location /alertmanager/ {
            set $upstream_alertmanager alertmanager;
            proxy_pass http://$upstream_alertmanager:9093;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Flower（Celery 监控，后端 flower:5555，--url-prefix=flower），挂在 /flower/。
        # 部分页面走 WebSocket，需 HTTP/1.1 + Upgrade/Connection 头；
        # read 超时放宽到 1h，避免长连接被 300s 默认超时切断。
        location /flower/ {
            set $upstream_flower flower;
            proxy_pass http://$upstream_flower:5555;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }

        # Keycloak SSO（后端 keycloak:8080，KC_HTTP_RELATIVE_PATH=/keycloak），
        # 原样透传，不做路径改写。仅 Airflow 启用 OAuth 时才被使用，
        # 未启用 SSO 时本 location 无流量、无副作用。
        location /keycloak/ {
            set $upstream_keycloak keycloak;
            proxy_pass http://$upstream_keycloak:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 自研告警中心（后端 alert-webhook:9099；GET / 页面、POST /alert），挂在 /alerts/。
        # 需要剥掉 /alerts 前缀：带变量的 proxy_pass 不支持自动 URI 替换
        # （不能像静态写法 proxy_pass http://alert-webhook:9099/ 那样靠结尾斜杠剥前缀），
        # 因此先用 rewrite ... break 把 /alerts/<x> 改写为 /<x>，再以无 URI 的
        # 变量 proxy_pass 透传改写后的 $uri：
        #   /alerts/      -> /
        #   /alerts/alert -> /alert
        # rewrite 默认保留 query string，POST /alert 的查询参数不受影响。
        location /alerts/ {
            set $upstream_alertwebhook alert-webhook;
            rewrite ^/alerts(/.*)$ $1 break;
            proxy_pass http://$upstream_alertwebhook:9099;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ----------------------------------------------------------------------
    # 8443：可视化 DAG 设计器（后端 dag-designer:80，nginx 托管 React SPA + /api）
    # 独立端口整站透传，避免子路径破坏 SPA 静态资源的 base path。
    # ----------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Frame-Options        SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff    always;

        # 设计器整站（含 /api）原样透传
        location / {
            set $upstream_designer dag-designer;
            proxy_pass http://$upstream_designer:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
