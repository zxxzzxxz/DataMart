apiVersion: 1
groups:
  - orgId: 1
    name: datamart-alerts
    folder: Airflow
    interval: 1m
    rules:
      # 漏跑兜底：Scheduler 心跳消失（进程宕机 → 所有 DAG 都不会被调度）
      - uid: airflow-scheduler-heartbeat-missing
        title: "Airflow Scheduler 心跳丢失：调度停摆，所有任务漏跑"
        condition: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Scheduler 超过 5 分钟无心跳，DAG 调度已停摆"
        labels:
          severity: critical
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: absent(airflow_scheduler_heartbeat)
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: prometheus
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: C
              type: classic_conditions
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query
      # 任务失败率：10 分钟内有任务进入 failed 终态
      - uid: airflow-task-failures
        title: "Airflow 存在失败任务（10 分钟窗口）"
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "最近 10 分钟内有任务失败，请到 Airflow UI 查看"
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              expr: sum(increase(airflow_ti_finish{state="failed"}[10m]))
              instant: true
              range: false
              datasource:
                type: prometheus
                uid: prometheus
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: C
              type: classic_conditions
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
                  type: query
