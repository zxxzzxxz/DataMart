apiVersion: 1
# 平台告警规则已全部迁移到 Prometheus 侧（docker/prometheus/rules/datamart.yml），
# 经外置 Alertmanager 统一分组/静默/路由。
#
# deleteRules：清理历史 file 来源的规则（file  provisioning 无法通过删文件/空 groups
# 清除它们，deleteRules 是官方支持的删除通道；清理完成后保留本段也无副作用——
# 对不存在的 uid 重复删除是幂等的）。
deleteRules:
  - orgId: 1
    uid: airflow-scheduler-heartbeat-missing
  - orgId: 1
    uid: airflow-task-failures

groups: []
