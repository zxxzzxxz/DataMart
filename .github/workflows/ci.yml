name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff 代码检查
        run: |
          pip install ruff
          ruff check dags plugins tests
          ruff format --check dags plugins tests

  dag-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖（带 Airflow 官方 constraints 保证可复现）
        run: |
          pip install -r requirements.txt \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt"
      - name: DAG 完整性与结构测试
        run: python -m pytest tests -q
        env:
          # 测试只需解析 DAG，不需要真实元数据库
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow-test.db
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          # 让 plugins/ 下的共享模块（alerting/incremental）可被 DAG 导入
          AIRFLOW__CORE__PLUGINS_FOLDER: ${{ github.workspace }}/plugins
